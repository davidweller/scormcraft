# Builds the Windows installer and attaches it to a GitHub Release.
#
# Runs when a v* tag is pushed. To rebuild an existing tag by hand, use
# "Run workflow" and give the tag name.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v1.1.1
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check the tag matches package.json
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match package.json version $version." }
          "VERSION=$version" >> $env:GITHUB_ENV

      # The tests import the Prisma client, which a clean checkout doesn't have.
      - run: npm run db:generate

      - run: npm test

      - run: npm run desktop:build:win

      - name: Write the release notes
        shell: pwsh
        run: |
          # The notes are this version's section of CHANGELOG.md.
          $notes = @()
          $inSection = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^## ') {
              if ($inSection) { break }
              if ($line.StartsWith("## $env:VERSION ")) { $inSection = $true }
              continue
            }
            if ($inSection) { $notes += $line }
          }
          if (-not $inSection) { throw "No section for $env:VERSION in CHANGELOG.md." }
          $notes += ''
          $notes += '## Install'
          $notes += ''
          $notes += "Download ``SCORMcraft-Setup-$env:VERSION.exe`` below and run it. The installer isn't code-signed, so Windows SmartScreen will warn you: choose **More info**, then **Run anyway**."
          $notes += ''
          $notes += 'Installing over an older version keeps your courses.'
          Set-Content release-notes.md $notes

      - name: Publish the release
        shell: pwsh
        run: |
          gh release create $env:TAG "dist/SCORMcraft-Setup-$env:VERSION.exe" --title "SCORMcraft $env:VERSION" --notes-file release-notes.md --verify-tag
